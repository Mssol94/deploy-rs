name: "Upstream Sync"
on:
  schedule:
    - cron: "0 0 * * *" # every day at midnight
  workflow_dispatch:

jobs:
  sync_latest_from_upstream:
    runs-on: ubuntu-latest
    name: Sync latest commits from upstream repo
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-git@v1
      - name: Sync upstream and create PR
        run: |
          # Add upstream
          git remote add upstream https://github.com/serokell/deploy-rs.git
          git fetch upstream

          upstream_branch="master"
          head="ci-upstream-sync"
          base="master"

          upstream_commit=$(git rev-parse upstream/${upstream_branch})

          if git rev-parse HEAD | grep -q "$upstream_commit"; then
            echo "No new commits from upstream. Exiting."
            exit 0
          fi

          git checkout -b ci-upstream-sync upstream/${upstream_branch}
          git push origin ci-upstream-sync --force

          pr_title="Sync latest commits from upstream ($upstream_commit:0:7)"
          commits=$(git log --pretty=format:"%h - %s" HEAD..upstream/${upstream_branch})
          details="$(printf "<details><summary>Commits from upstream</summary>\n\n\`\`\`\n%s\n\`\`\`\n</details>" "$commits")"
          pr_body="This PR syncs the latest commits from the upstream repository.\n\n${details}"

          jq -n \
            --arg base "$base" \
            --arg head "$head" \
            --arg title "$pr_title" \
            --arg body "$pr_body" \
            '{
              "base": $base,
              "head": $head,
              "title": $title,
              "body": $body
            }' |
            curl --fail-with-body "$FORGEJO_SERVER_URL/api/v1/repos/$FORGEJO_REPOSITORY/pulls" \
              -H "Authorization: token $FORGEJO_TOKEN" \
              -H "Content-Type: application/json" \
              -d @-
