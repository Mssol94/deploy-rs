name: Create Pull Request for Upstream Sync
on:
  push:
    branches:
      - upstream-sync
  workflow_dispatch:

jobs:
  create_pull_request:
    runs-on: [native-x86_64-linux, big-parallel]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: upstream-sync
      - name: Create Pull Request
        run: |
          fj --host "${FORGEJO_SERVER_URL}" auth add-key "${FORGEJO_ACTOR}" "${FORGEJO_TOKEN}"
          fj auth list